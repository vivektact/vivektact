name: Generate Snake Animation

on:
  schedule: 
    - cron: "0 0 * * *" # runs every day at midnight
  workflow_dispatch: # allows manual run
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # ✅ allow pushing to branches
    steps:
      - uses: actions/checkout@v3

      # Generate the snake SVG
      - uses: Platane/snk@v3
        with:
          github_user_name: vivektact
          outputs: |
            dist/snake.svg?color_snake=000000   # 🐍 Black snake
            dist/snake-dark.svg?palette=github-dark  # 🌙 Dark mode version

      # Push the generated files to the output branch
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
